services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotelio_app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hotelio_net

  db:
    image: mysql:8.0
    container_name: hotelio_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hotelio}
      MYSQL_USER: ${DB_USERNAME:-hotelio}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotelio_net

  redis:
    image: redis:7-alpine
    container_name: hotelio_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - hotelio_net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotelio_scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
    command: sh -c "while true; do php /var/www/html/artisan schedule:run >> /dev/null 2>&1; sleep 60; done"
    depends_on:
      - db
      - redis
    networks:
      - hotelio_net

volumes:
  db_data:
  redis_data:
  app_storage:
  app_logs:

networks:
  hotelio_net:
    driver: bridge
